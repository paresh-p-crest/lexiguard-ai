AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: LexiGuard AI - serverless legal intake, transcription, analysis, and chat

Parameters:
  ResourcePrefix:
    Type: String
    Default: sandbox
    AllowedPattern: "^[a-z0-9-]+$"
    MaxLength: 24
    Description: Lowercase namespace/prefix for generated resource names, for example paresh, friend1, demo.
  BucketName:
    Type: String
    Default: lexiguard-legal-data-ps-b402
    Description: Existing S3 bucket for audio uploads, Transcribe JSON, and KB transcripts. This stack does not create a bucket.
  KnowledgeBaseId:
    Type: String
    Default: "TUGECFALFA"
    Description: Existing Amazon Bedrock Knowledge Base ID.
  KnowledgeBaseDataSourceId:
    Type: String
    Default: ""
    Description: Optional Bedrock KB data source ID. Leave blank to use the first data source in the KB.

Resources:
  LexiGuardApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "${ResourcePrefix}-lexiguard-api"
      StageName: Prod
      Cors:
        AllowMethods: "'GET,POST,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: "'*'"

  ServerlessRestApiGatewayResponseDefault4XX:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref LexiGuardApi
      ResponseType: DEFAULT_4XX
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,DELETE,OPTIONS'"

  ServerlessRestApiGatewayResponseDefault5XX:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref LexiGuardApi
      ResponseType: DEFAULT_5XX
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,DELETE,OPTIONS'"

  # 1. Security (From previous steps)
  LexiGuardKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub "Key for ${ResourcePrefix} LexiGuard"
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: Enable IAM Admin Permissions
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"

  LexiGuardKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/${ResourcePrefix}-lexiguard"
      TargetKeyId: !Ref LexiGuardKey

  # Case records (pay-per-request DynamoDB).
  LexiGuardCasesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ResourcePrefix}-lexiguard-cases"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  # Analyzer Lambda
  LexiGuardAnalyzer:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ResourcePrefix}-lexiguard-analyzer"
      CodeUri: src/
      Handler: analyzer.lambda_handler
      Runtime: python3.11
      Timeout: 60
      Environment:
        Variables:
          BEDROCK_MODEL_ID: "anthropic.claude-3-sonnet-20240229-v1:0"
          CASES_TABLE: !Ref LexiGuardCasesTable
          KB_DOC_PREFIX: "LexiGuard-transcripts/"
      Policies:
        - Statement:
            - Effect: Allow
              Action: "bedrock:InvokeModel"
              Resource: "*"
            - Effect: Allow
              Action: "kms:Decrypt"
              Resource: !GetAtt LexiGuardKey.Arn
        - S3ReadPolicy:
            BucketName: !Ref BucketName
        - S3WritePolicy:
            BucketName: !Ref BucketName
        - DynamoDBCrudPolicy:
            TableName: !Ref LexiGuardCasesTable

  # Step Functions workflow
  LexiGuardWorkflow:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub "${ResourcePrefix}-lexiguard-workflow"
      Definition:
        StartAt: StartTranscription
        States:
          StartTranscription:
            Type: Task
            Resource: "arn:aws:states:::aws-sdk:transcribe:startTranscriptionJob"
            Parameters:
              TranscriptionJobName.$: "$$.Execution.Name"
              LanguageCode: "en-US"
              Media:
                MediaFileUri.$: "States.Format('s3://{}/{}', $.bucket, $.key)"
              OutputBucketName: !Ref BucketName
              OutputKey: "LexiGuard-transcribe-json/"
              Settings:
                ShowSpeakerLabels: true
                MaxSpeakerLabels: 2
            Next: Wait30Seconds
          Wait30Seconds:
            Type: Wait
            Seconds: 20
            Next: CheckJobStatus
          CheckJobStatus:
            Type: Task
            Resource: "arn:aws:states:::aws-sdk:transcribe:getTranscriptionJob"
            Parameters:
              TranscriptionJobName.$: "$$.Execution.Name"
            Next: IsItDone?
          IsItDone?:
            Type: Choice
            Choices:
              - Variable: "$.TranscriptionJob.TranscriptionJobStatus"
                StringEquals: "COMPLETED"
                Next: AnalysisWithBedrock
              - Variable: "$.TranscriptionJob.TranscriptionJobStatus"
                StringEquals: "FAILED"
                Next: JobFailed
            Default: Wait30Seconds
          AnalysisWithBedrock:
            Type: Task
            Resource: !GetAtt LexiGuardAnalyzer.Arn
            Next: SyncKnowledgeBase
          SyncKnowledgeBase:
            Type: Task
            Resource: !GetAtt LexiGuardKBSync.Arn
            End: true
          JobFailed:
            Type: Fail
            Error: "TranscribeJobFailed"
      Policies:
        - Statement:
            - Effect: Allow
              Action: ["transcribe:*", "lambda:InvokeFunction"]
              Resource: "*"
            - Effect: Allow
              Action: ["kms:Decrypt", "kms:GenerateDataKey"]
              Resource: !GetAtt LexiGuardKey.Arn
        - S3ReadPolicy:
            BucketName: !Ref BucketName
        - S3WritePolicy:
            BucketName: !Ref BucketName

  LexiGuardWatchman:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ResourcePrefix}-lexiguard-watchman"
      CodeUri: src/
      Handler: app.lambda_handler
      Runtime: python3.11
      Environment:
        Variables:
          STATE_MACHINE_ARN: !Ref LexiGuardWorkflow
      Policies:
        - StepFunctionsExecutionPolicy:
            StateMachineName: !GetAtt LexiGuardWorkflow.Name
        - S3ReadPolicy:
            BucketName: !Ref BucketName

  # Allow the existing S3 bucket to invoke watchman (notification configured on the bucket).
  LexiGuardWatchmanS3Permission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref LexiGuardWatchman
      Principal: s3.amazonaws.com
      SourceArn: !Sub "arn:aws:s3:::${BucketName}"
      SourceAccount: !Ref AWS::AccountId

  # Sync Bedrock Knowledge Base after transcript changes
  LexiGuardKBSync:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ResourcePrefix}-lexiguard-kb-sync"
      CodeUri: src/
      Handler: kb_sync.lambda_handler
      Runtime: python3.11
      Timeout: 30
      Environment:
        Variables:
          KB_ID: !Ref KnowledgeBaseId
          DATA_SOURCE_ID: !Ref KnowledgeBaseDataSourceId
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - "bedrock:StartIngestionJob"
                - "bedrock:ListDataSources"
              Resource: "*"

  LexiGuardFetcher:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ResourcePrefix}-lexiguard-fetcher"
      CodeUri: src/
      Handler: fetcher.lambda_handler
      Runtime: python3.11
      Timeout: 15
      Environment:
        Variables:
          CASES_TABLE: !Ref LexiGuardCasesTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref LexiGuardCasesTable
      Events:
        GetCases:
          Type: Api
          Properties:
            RestApiId: !Ref LexiGuardApi
            Path: /cases
            Method: get

  # API to delete a case and related S3 objects
  LexiGuardDeleter:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ResourcePrefix}-lexiguard-deleter"
      CodeUri: src/
      Handler: deleter.lambda_handler
      Runtime: python3.11
      Timeout: 30
      Environment:
        Variables:
          CASES_TABLE: !Ref LexiGuardCasesTable
          KB_ID: !Ref KnowledgeBaseId
          DATA_SOURCE_ID: !Ref KnowledgeBaseDataSourceId
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - "s3:DeleteObject"
              Resource: !Sub "arn:aws:s3:::${BucketName}/*"
            - Effect: Allow
              Action:
                - "transcribe:DeleteTranscriptionJob"
              Resource: "*"
            - Effect: Allow
              Action:
                - "bedrock:StartIngestionJob"
                - "bedrock:ListDataSources"
              Resource: "*"
        - DynamoDBCrudPolicy:
            TableName: !Ref LexiGuardCasesTable
      Events:
        DeleteCase:
          Type: Api
          Properties:
            RestApiId: !Ref LexiGuardApi
            Path: /cases/{id}
            Method: delete

   # API to get Upload URL
  LexiGuardSigner:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ResourcePrefix}-lexiguard-signer"
      CodeUri: src/
      Handler: signer.lambda_handler
      Runtime: python3.11
      Environment:
        Variables:
          BUCKET_NAME: !Ref BucketName
      Policies:
        - S3WritePolicy:
            BucketName: !Ref BucketName
        - Statement:
            - Effect: Allow
              Action:
                - "kms:Decrypt"
                - "kms:GenerateDataKey"
              Resource: !GetAtt LexiGuardKey.Arn
      Events:
        GetURL:
          Type: Api
          Properties:
            RestApiId: !Ref LexiGuardApi
            Path: /sign
            Method: get

  # API to Chat with Knowledge Base
  LexiGuardChat:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ResourcePrefix}-lexiguard-chat"
      CodeUri: src/
      Handler: chat.lambda_handler
      Runtime: python3.11
      Timeout: 30
      Environment:
        Variables:
          KB_ID: !Ref KnowledgeBaseId
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - "bedrock:RetrieveAndGenerate"
                - "bedrock:Retrieve"
                - "bedrock:InvokeModel"
              Resource: "*"
      Events:
        PostChat:
          Type: Api
          Properties:
            RestApiId: !Ref LexiGuardApi
            Path: /chat
            Method: post         

Outputs:
  ApiUrl:
    Description: "URL for the cases API"
    Value: !Sub "https://${LexiGuardApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/cases"
  ApiBaseUrl:
    Description: "Base URL for the React API_BASE setting"
    Value: !Sub "https://${LexiGuardApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
  DataBucketName:
    Description: "S3 bucket for uploaded audio and transcripts"
    Value: !Ref BucketName
  CasesTableName:
    Description: "DynamoDB table for structured case records"
    Value: !Ref LexiGuardCasesTable
  WorkflowArn:
    Description: "LexiGuard Step Functions workflow ARN"
    Value: !Ref LexiGuardWorkflow
